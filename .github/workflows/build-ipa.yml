name: Build opview iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios
          pod repo update
          pod install
          cd ..

      - name: Build unsigned IPA
        run: flutter build ipa --release --no-codesign --export-options-plist=ios/Runner/ExportOptions.plist || flutter build ios --release --no-codesign

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r opview.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opview-ios-ipa
          path: opview.ipa
